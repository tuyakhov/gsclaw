# Cloudflare Workers. The "Deploy to Cloudflare" button runs `pnpm build` then `wrangler deploy`
# and prompts for the secrets listed in .dev.vars.example.
name = "gsclaw"
main = "src/adapters/cloudflare.ts"
compatibility_date = "2026-09-01"

[observability]
enabled = true

# Dashboard assets (built by `pnpm build`). Requests that match no file fall through to the worker,
# so `/`, `/mcp` and `/api/*` are always handled by GSClaw.
[assets]
directory = "./dist/public"
