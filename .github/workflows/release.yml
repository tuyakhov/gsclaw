name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # npm trusted publishing (OIDC): no npm token is stored anywhere. The trusted publisher on
  # npmjs.com only allows staging, so this uploads the version and a maintainer approves it with
  # 2FA before it goes live (npmjs.com, or `npm stage approve`). See CONTRIBUTING.md#releasing.
  npm:
    name: Stage npm release (approve on npmjs.com)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 and `npm stage` came later; pin a known version.
      - run: npm install --global npm@11.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # The contributor-only preinstall guard (only-allow pnpm) must not reach users. prepack strips
      # it from the tarball, but npm builds the registry metadata from package.json before prepack
      # runs (0.1.1 was listed as having an install script), so remove it here and make sure no
      # install script is left.
      - name: Remove install scripts from the published manifest
        run: |
          npm pkg delete scripts.preinstall
          node -e "const s = require('./package.json').scripts ?? {}; const found = ['preinstall', 'install', 'postinstall'].filter((k) => s[k]); if (found.length) { console.error('install scripts would be published:', found); process.exit(1) }"
      # npm, not pnpm: npm's trusted publishing and staging are only documented for its own CLI.
      - run: npm stage publish --provenance

  docker:
    name: Publish image to GHCR
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release-please.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
