# Fly.io: deploys the published image (ghcr.io/tuyakhov/gsclaw).
#   fly launch --config deploy/fly.toml --copy-config --no-deploy
#   fly secrets set GOOGLE_SERVICE_ACCOUNT_JSON="$(cat service-account.json)" GSCLAW_ACCESS_TOKEN="$(openssl rand -hex 32)"
#   fly deploy --config deploy/fly.toml
# To build from source instead: fly deploy --config deploy/fly.toml --dockerfile Dockerfile
app = "gsclaw"
primary_region = "iad"

[build]
  image = "ghcr.io/tuyakhov/gsclaw:latest"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
